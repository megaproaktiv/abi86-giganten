# https://taskfile.dev

version: "3"

vars:
  GREETING: Hello, World!

include:
  hugo: abi86-giganten.de/Taskfile.yml

includes:
  api:
    taskfile: ./abi86-giganten.de/Taskfile.yml
    dir: ./abi86-giganten.de

tasks:
  default:
    cmds:
      - task -l
    silent: true

  deploy:
    desc: Deploy website to production
    cmds:
      - task: api:build
      - git add .
      - git commit -m "Deploy website"
      - git push

  deploy-infra:
    desc: Deploy infrastructure to production
    dir: infra
    cmds:
      - terraform validate
      - terraform plan
      - terraform apply

  logs:
    desc: Show Amplify deployment logs
    dir: infra
    cmds:
      - |
        APP_ID=$(terraform output -raw amplify_app_id)
        JOB_ID=$(aws amplify list-jobs --app-id $APP_ID --branch-name main --region us-east-1 --query 'jobSummaries[0].jobId' --output text)
        aws amplify get-job --app-id $APP_ID --branch-name main --job-id $JOB_ID --region us-east-1
